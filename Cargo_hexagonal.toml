[package]
name = "kusanagi"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kusanagi"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
actix-web = "4.0"
actix-files = "0.6"

# Kubernetes client
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# Prometheus client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Logging
env_logger = "0.11"
