[package]
name = "kusanagi"
version = "0.3.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
async-trait = "0.1"
futures = "0.3"


# Optional features
thiserror = "2.0"
anyhow = "1.0"

# Legacy dependencies
kube = { version = "3.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sysinfo = "0.38"
rumqttc = "0.25"
irc = "0.15"
rustls-pemfile = "2.2" # Force version to avoid unmaintained warning
tracing = "0.1"
tracing-subscriber = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
toml = "0.8"
aws-config = "1.1"
aws-sdk-s3 = "1.13"

[build-dependencies]
chrono = "0.4"
