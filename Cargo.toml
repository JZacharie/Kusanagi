[package]
name = "kusanagi"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kusanagi"
path = "src/main.rs"

[[bin]]
name = "kusanagi-complete"
path = "src/main_complete.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
actix-web = "4.0"
actix-files = "0.6"

# Kubernetes client
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.14"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Random number generation
rand = "0.8"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# AWS SDK (optional)
aws-sdk-s3 = { version = "1.0", optional = true }
aws-config = { version = "1.0", optional = true }

# Metrics
prometheus = "0.13"

# Actor system
actix = "0.13"

# Validation
validator = { version = "0.16", features = ["derive"] }

# MQTT client
rumqttc = "0.24"

# CSV processing
csv = "1.3"

# Lazy static initialization
once_cell = "1.19"

# Database (optional)
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"], optional = true }

# WebSocket support
tokio-tungstenite = "0.21"

[features]
default = []
aws = ["aws-sdk-s3", "aws-config"]
database = ["sqlx"]
legacy = ["database", "aws"]
complete = ["legacy"]
