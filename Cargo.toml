[package]
name = "kusanagi"
version = "0.3.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
async-trait = "0.1"
futures = "0.3"

# Optional features
thiserror = "2.0"
anyhow = "1.0"

# Legacy dependencies
kube = { version = "3.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sysinfo = "0.38"
rumqttc = "0.25"
irc = "1.0"
rustls-pemfile = "2.2"
rustls-pki-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
toml = "0.8"
aws-config = "1.1"
aws-sdk-s3 = "1.13"
aws-smithy-runtime = { version = "1.1", features = ["client", "connector-hyper-0-14-x"] }
hyper-rustls = { version = "0.27", features = ["rustls-native-certs", "http2"] }
tracing-appender = "0.2.4"

# Sprint 5: Robustness & Observability
utoipa = { version = "5.3", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower_governor = "0.8"

# Sprint 6: Monitoring & Tracing
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
dotenvy = "0.15.7"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
native-tls = "0.2"
postgres-native-tls = "0.5"

[build-dependencies]
chrono = "0.4"
