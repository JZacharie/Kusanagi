[package]
name = "kusanagi"
version = "0.2.0"
edition = "2021"

[lib]
name = "kusanagi"
path = "src/lib.rs"

[[bin]]
name = "kusanagi"
path = "src/main_working.rs"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
http = "1.0"
aws-config = "1.8"
aws-sdk-s3 = "1.121"
csv = "1.3"
lazy_static = "1.4"
rand = "0.9"
rss = "2.0"
feed-rs = "2"
oauth2 = "5.0"
base64 = "0.22"
regex = "1.12.3"
sysinfo = "0.38"
rumqttc = "0.25"
tokio-stream = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
prometheus = "0.14"
thiserror = "2.0"
config = "0.15"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }
uuid = { version = "1.20", features = ["v4"] }
validator = { version = "0.20", features = ["derive"] }
once_cell = "1.20"
