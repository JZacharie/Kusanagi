[package]
name = "kusanagi"
version = "0.2.0"
edition = "2021"

[lib]
name = "kusanagi"
path = "src/lib.rs"

[[bin]]
name = "kusanagi"
path = "src/main.rs"

[dependencies]
actix-web = "4.4"
actix-web-actors = "4.2"
actix = "0.13"
actix-files = "0.6"
actix-rt = "2.9"
dotenv = "0.15"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kube = { version = "0.99", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.9"
reqwest = { version = "0.12", features = ["json"] }
http = "1.0"
aws-config = "1.8"
aws-sdk-s3 = "1.121"
csv = "1.3"
lazy_static = "1.4"
rand = "0.9"
rss = "2.0"
feed-rs = "2"
oauth2 = "5.0"
base64 = "0.22"
regex = "1.12.3"
sysinfo = "0.38"
rumqttc = "0.25"
tokio-stream = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
prometheus = "0.14"
thiserror = "2.0"
config = "0.15"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }
uuid = { version = "1.20", features = ["v4"] }
validator = { version = "0.20", features = ["derive"] }
once_cell = "1.20"
