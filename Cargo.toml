[package]
name = "kusanagi"
version = "0.2.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.0", features = ["full"] }
actix-web = "4.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
async-trait = "0.1"
actix-files = "0.6"
actix-web-actors = "4.3"
actix = "0.13"

# Optional features
thiserror = "1.0"
anyhow = "1.0"

# Legacy dependencies
kube = { version = "3.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sysinfo = "0.30"
rumqttc = "0.24"
tracing = "0.1"
aws-config = "1.1"
aws-sdk-s3 = "1.13"

[build-dependencies]
chrono = "0.4"
