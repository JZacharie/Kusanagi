[package]
name = "kusanagi"
version = "0.3.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs", "cors", "compression-gzip", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
async-trait = "0.1"
futures = "0.3"

# Optional features
thiserror = "2.0"
anyhow = "1.0"

# Legacy dependencies
kube = { version = "3.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
reqwest = { version = "0.13", features = ["json", "multipart", "query", "form"] }
base64 = "0.22"
sysinfo = "0.39"
rumqttc = { version = "0.25", features = ["use-native-tls"], default-features = false }
irc = "1.1"
rustls-pki-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
toml = "0.9"
aws-config = { version = "1.8", features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sso", "credentials-process"], default-features = false }
aws-sdk-s3 = { version = "1.127", features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"], default-features = false }
# aws-sdk-cloudwatch and aws-sdk-costexplorer removed (formerly for bedrock)
aws-smithy-runtime = { version = "1.10", features = ["client", "default-https-client", "rt-tokio", "connector-hyper-0-14-x"], default-features = false }
hyper-tls-05 = { package = "hyper-tls", version = "0.5" } # Specific version for S3/Legacy (hyper 0.14)
hyper-014 = { package = "hyper", version = "1.0" }
hyper = "1.0" # And the modern hyper.
tracing-appender = "0.2.4"

# Sprint 5: Robustness & Observability
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower_governor = "0.8"

# Sprint 6: Monitoring & Tracing
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
dotenvy = "0.15.7"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
# aws-credential-types removed (formerly for bedrock)

[dev-dependencies]
async-trait = "0.1"

[build-dependencies]
chrono = "0.4.45"
