[build]
# Exclude generated files
workspace = true

[report]
# Output formats
out = ["Html", "Xml"]

[run]
# Test timeout in seconds
timeout = "300s"

# Run tests with all features
all-features = true

# Exclude paths from coverage
exclude-files = [
    "tests/*",
    "target/*",
    "*/build.rs",
]

# Follow symbolic links
follow-exec = true

# Count hits in tests
count = true

# Verbose output
verbose = true
