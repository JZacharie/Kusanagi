[package]
name = "kusanagi-complete"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "kusanagi-complete"
path = "src/main_complete.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
actix-web = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
env_logger = "0.10"
