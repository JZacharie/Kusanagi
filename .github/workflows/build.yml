name: Kusanagi Build

# Workflow CI/CD pour le projet Kusanagi
# Ce pipeline gère :
# 1. Validation rapide (lint, check, audit)
# 2. Scan de sécurité
# 3. Compilation optimisée (cache Rust)
# 4. Construction de l'image Docker (GHCR)
# 5. Déploiement sur le cluster Kubernetes (Production)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # ============================================================================
  # Phase 1: Validation Rapide
  # Exécution parallèle des tests, linter et audit de dépendances
  # ============================================================================
  fast-check:
    name: ⚡ Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "kusanagi"

      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,nextest

      - name: Run Tests (Nextest)
        run: cargo nextest run --package kusanagi

      - name: Run Validation (Clippy & Audit)
        run: |
          cargo clippy -- -D warnings
          # Ignore unmaintained deps: 
          # - RUSTSEC-2021-0153: encoding (via irc)
          # - RUSTSEC-2025-0134: rustls-pemfile (via rumqttc)
          cargo audit --ignore RUSTSEC-2021-0153 --ignore RUSTSEC-2025-0134

  # ============================================================================
  # Phase 2: Audit de Sécurité
  # Recherche de secrets exposés dans le code
  # ============================================================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -ssfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --redact --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================================
  # Phase 3: Construction du binaire Rust
  # Optimisation : On compile le binaire hors de Docker pour profiter du cache GitHub Actions
  # ============================================================================
  build-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust with cache
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "kusanagi-release"
          workspaces: "."

      - name: Build Rust binary (release)
        run: |
          cargo build --release --bin kusanagi --locked
          ls -lh target/release/kusanagi

      # Sauvegarde le binaire compilé pour qu'il soit utilisé par le job Docker
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusanagi-binary
          path: target/release/kusanagi
          retention-days: 1

  # ============================================================================
  # Phase 4: Containerisation
  # Récupère le binaire compilé et le place dans une image Docker minimale
  # ============================================================================
  build-docker:
    needs: build-rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Récupération du binaire compilé précédemment
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kusanagi-binary
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/kusanagi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (no cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release-ci
          build-args: |
            PREBUILT_BINARY=target/release/kusanagi
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Phase 5: Déploiement Continu (CD)
  # Déploie uniquement sur la branche main après succès du build
  # ============================================================================
  deploy:
    name: 🚢 Deploy to Cluster
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: https://kusanagi.p.zacharie.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_JO3 }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollout deployment
        run: |
          kubectl rollout restart deployment kusanagi -n kusanagi
          kubectl rollout status deployment kusanagi -n kusanagi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_TEMP_DIR: ${{ github.workspace }}/.trivy-tmp
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      - name: Notify Slack
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg msg "$COMMIT_MSG" \
            '{text: ("✅ *Kusanagi Deployed*\n\n🚀 Version: `${{ github.sha }}`\n📝 " + $msg)}' \
            | curl -X POST -H 'Content-type: application/json' -d @- $SLACK_WEBHOOK          

