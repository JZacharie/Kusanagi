name: Kusanagi Build

# Workflow CI/CD pour le projet Kusanagi
# Ce pipeline gère :
# 1. Validation rapide (lint, check, audit)
# 2. Scan de sécurité
# 3. Compilation optimisée (cache Rust)
# 4. Construction de l'image Docker (GHCR)
# 5. Déploiement sur le cluster Kubernetes (Production)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # Phase 1: Validation Rapide
  # Exécution parallèle des tests, linter et audit de dépendances
  # ============================================================================
  fast-check:
    name: ⚡ Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "kusanagi"

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Quick compile check
        run: cargo check

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  # ============================================================================
  # Phase 2: Audit de Sécurité
  # Recherche de secrets exposés dans le code
  # ============================================================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================================
  # Phase 3: Construction du binaire Rust
  # Optimisation : On compile le binaire hors de Docker pour profiter du cache GitHub Actions
  # ============================================================================
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust with cache
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "kusanagi"

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Build Rust binary (cached)
        run: |
          cargo build --release --bin kusanagi
          ls -lh target/release/kusanagi
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      # Sauvegarde le binaire compilé pour qu'il soit utilisé par le job Docker
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kusanagi-binary
          path: target/release/kusanagi
          retention-days: 1

  # ============================================================================
  # Phase 4: Containerisation
  # Récupère le binaire compilé et le place dans une image Docker minimale
  # ============================================================================
  build-docker:
    needs: build-rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Récupération du binaire compilé précédemment
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kusanagi-binary
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/kusanagi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (no cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release-ci
          build-args: |
            PREBUILT_BINARY=target/release/kusanagi
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Phase 5: Déploiement Continu (CD)
  # Déploie uniquement sur la branche main après succès du build
  # ============================================================================
  deploy:
    name: 🚢 Deploy to Cluster
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: Dev
      url: https://kusanagi-dev.p.zacharie.org
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_JO3 }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollout deployment
        run: |
          kubectl rollout restart deployment kusanagi-dev -n kusanagi-dev
          kubectl rollout status deployment kusanagi-dev -n kusanagi-dev

      - name: Notify Slack
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg msg "$COMMIT_MSG" \
            '{text: ("✅ *Kusanagi (Dev) Deployed*\n\n🚀 Version: `${{ github.sha }}`\n🌐 URL: https://kusanagi-dev.p.zacharie.org\n📝 " + $msg)}' \
            | curl -X POST -H 'Content-type: application/json' -d @- $SLACK_WEBHOOK
