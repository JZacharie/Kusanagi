name: Kusanagi Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean and Verify Structure
        run: |
          echo "🧹 Cleaning old files..."
          rm -f static/js/k8s.js
          cargo clean
          rm -rf target/
          
          echo "🔍 Verifying modular structure..."
          ls -la static/js/k8s/
          test -f static/js/k8s/main.js || (echo "❌ Missing main.js" && exit 1)
          test -f static/js/k8s/services.js || (echo "❌ Missing services.js" && exit 1)
          test -f static/js/k8s/argocd.js || (echo "❌ Missing argocd.js" && exit 1)
          
          if [ -f "static/js/k8s.js" ]; then
            echo "❌ Old k8s.js still exists!"
            exit 1
          fi
          echo "✅ Structure verified"

      - name: Debug - Show Date
        run: |
          echo "Current date: $(date)"
          echo "Expected build time: $(date -u +"%Y-%m-%d %H:%M:%S") UTC"

      - name: Build Rust Binary
        run: |
          echo "🔨 Building Rust binary (fresh)..."
          cargo build --release 2>&1
          echo ""
          echo "📁 Binary info:"
          ls -lh target/release/kusanagi
          echo ""
          echo "🔍 Binary timestamp check:"
          date -u +"%Y-%m-%d %H:%M:%S UTC"
          echo "File modification time:"
          stat -c "%y" target/release/kusanagi

      - name: Verify Binary Fresh
        run: |
          echo "Verifying binary exists and is fresh..."
          if [ ! -f "target/release/kusanagi" ]; then
            echo "❌ Binary not found!"
            exit 1
          fi
          echo "✅ Binary exists"
          ls -la target/release/kusanagi
          echo ""
          echo "Binary timestamp:"
          stat target/release/kusanagi || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image (NO CACHE)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: release-ci
          build-args: |
            PREBUILT_BINARY=target/release/kusanagi
          push: false
          tags: kusanagi:test
          load: true
          no-cache: true

      - name: Verify Docker Image
        run: |
          echo "🔍 Verifying image structure..."
          
          # Check no old k8s.js
          if docker run --rm kusanagi:test test -f /app/static/js/k8s.js 2>/dev/null; then
            echo "❌ FAIL: Old k8s.js found in image!"
            exit 1
          fi
          echo "✅ Old k8s.js not present"
          
          # Check new modules exist
          docker run --rm kusanagi:test test -f /app/static/js/k8s/main.js || (echo "❌ Missing main.js" && exit 1)
          docker run --rm kusanagi:test test -f /app/static/js/k8s/services.js || (echo "❌ Missing services.js" && exit 1)
          
          echo "📁 Content of /app/static/js/k8s/:"
          docker run --rm kusanagi:test ls -la /app/static/js/k8s/
          
          echo "✅ Image structure verified"

      - name: Push Docker Image (use tested image)
        if: github.event_name != 'pull_request'
        run: |
          echo "📤 Pushing tested image..."
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          
          # Tag and push the already tested image
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            echo "Tagging: $tag"
            docker tag kusanagi:test "$tag"
            docker push "$tag"
          done
          
          echo "✅ Push complete"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build Successful**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Old k8s.js absent" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ New modular structure present" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Binary compiled successfully" >> $GITHUB_STEP_SUMMARY
