<!-- network section -->
<h2 class="section-title">🌐 Network Flows (Cilium/Hubble)</h2>

<!-- Network Controls -->
<div class="network-controls" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
    <select id="network-namespace-filter" class="cyber-select" onchange="KusanagiNetwork.filterByNamespace(this.value)">
        <option value="">All Namespaces</option>
    </select>
    <button class="cyber-btn" onclick="KusanagiNetwork.fetchAndRender()">
        🔄 Refresh
    </button>
    <button class="cyber-btn" onclick="KusanagiNetwork.exportData('json')">
        📥 Export JSON
    </button>
    <button class="cyber-btn" onclick="KusanagiNetwork.exportData('csv')">
        📥 Export CSV
    </button>
</div>

<!-- APM Performance Stats -->
<div id="network-perf-stats" class="network-perf-container" style="margin-bottom: 1.5rem;">
    <!-- Populated by JavaScript -->
</div>

<!-- Network Stats -->
<div id="network-stats" style="margin-bottom: 1.5rem;">
    <div class="loading">Loading network stats...</div>
</div>

<!-- Network Graph -->
<div class="issues-table-container" style="border-color: var(--neon-cyan); margin-bottom: 1.5rem;">
    <div class="issues-table-header" style="background: rgba(0, 255, 255, 0.1); border-color: var(--neon-cyan);">
        <span class="issues-table-title" style="color: var(--neon-cyan);">Service Graph</span>
    </div>
    <div id="network-visualization" style="min-height: 400px; background: rgba(0,0,0,0.3);">
        <div class="loading">Loading network graph...</div>
    </div>
</div>

<!-- Flow Matrix -->
<div class="issues-table-container" style="border-color: var(--neon-magenta);">
    <div class="issues-table-header" style="background: rgba(255, 0, 128, 0.1); border-color: var(--neon-magenta);">
        <span class="issues-table-title" style="color: var(--neon-magenta);">📊 Flow Matrix</span>
    </div>
    <div id="network-matrix">
        <div class="loading">Loading flow matrix...</div>
    </div>
</div>
