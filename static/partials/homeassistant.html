<!-- homeassistant section -->
<h2 class="section-title">🏠 Home Assistant</h2>

<!-- HA Stats -->
<div class="argocd-stats" id="ha-stats-grid" style="margin-bottom: 1.5rem;">
    <div class="stat-box info">
        <div class="stat-value" id="ha-sensors">-</div>
        <div class="stat-label">Sensors</div>
    </div>
    <div class="stat-box healthy">
        <div class="stat-value" id="ha-automations">-</div>
        <div class="stat-label">Automations</div>
    </div>
    <div class="stat-box info">
        <div class="stat-value" id="ha-devices">-</div>
        <div class="stat-label">Devices</div>
    </div>
</div>

<!-- Sensors Grid -->
<div class="issues-table-container" style="border-color: var(--neon-green); margin-bottom: 1.5rem;">
    <div class="issues-table-header" style="background: rgba(0, 255, 136, 0.1); border-color: var(--neon-green);">
        <span class="issues-table-title" style="color: var(--neon-green);">📊 Sensors</span>
        <span class="issues-count" id="ha-sensors-count" style="background: var(--neon-green);">0</span>
    </div>
    <div id="ha-sensors-content">
        <div class="loading">Loading sensors...</div>
    </div>
</div>

<!-- Automations Table -->
<div class="issues-table-container" style="border-color: var(--neon-cyan);">
    <div class="issues-table-header" style="background: rgba(0, 255, 255, 0.1); border-color: var(--neon-cyan);">
        <span class="issues-table-title" style="color: var(--neon-cyan);">⚙️ Automations</span>
        <span class="issues-count" id="ha-automations-count" style="background: var(--neon-cyan);">0</span>
    </div>
    <div id="ha-automations-content">
        <div class="loading">Loading automations...</div>
    </div>
</div>
