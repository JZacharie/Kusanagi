<!-- streaming section -->
<h2 class="section-title">🎬 New Streaming Movies</h2>

<!-- Streaming Stats -->
<div class="argocd-stats" id="streaming-stats-grid" style="margin-bottom: 1.5rem;">
    <div class="stat-box info">
        <div class="stat-value" id="streaming-total">-</div>
        <div class="stat-label">Total</div>
    </div>
    <div class="stat-box success">
        <div class="stat-value" id="streaming-films-count">-</div>
        <div class="stat-label">Films</div>
    </div>
    <div class="stat-box warning">
        <div class="stat-value" id="streaming-series-count">-</div>
        <div class="stat-label">Séries</div>
    </div>
    <div class="stat-box info">
        <div class="stat-value" id="streaming-source" style="font-size: 0.85rem;">Cinestream + JustWatch</div>
        <div class="stat-label">Sources</div>
    </div>
</div>

<!-- Filter Controls -->
<div class="filter-controls"
    style="margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
    <!-- Type filters -->
    <div id="streaming-type-buttons" style="display: contents;">
        <button class="cyber-btn active" id="btn-streaming-type-all" onclick="StreamingManager.filterType('all')">📺
            All</button>
        <button class="cyber-btn" id="btn-streaming-type-film" onclick="StreamingManager.filterType('film')">🎬
            Films</button>
        <button class="cyber-btn" id="btn-streaming-type-serie" onclick="StreamingManager.filterType('serie')">📺
            Séries</button>
    </div>

    <span style="opacity: 0.3;">|</span>

    <!-- Language filters -->
    <div id="streaming-filter-buttons" style="display: contents;">
        <button class="cyber-btn active" id="btn-streaming-all" onclick="StreamingManager.filter('all')">All</button>
        <button class="cyber-btn" id="btn-streaming-french" onclick="StreamingManager.filter('French')">French</button>
        <button class="cyber-btn" id="btn-streaming-multi" onclick="StreamingManager.filter('Multi')">Multi</button>
    </div>

    <button class="cyber-btn" id="btn-streaming-refresh" onclick="StreamingManager.manualRefresh()"
        style="margin-left: auto;">
        🔄 REFRESH
    </button>
</div>

<!-- Search Bar -->
<div style="margin-bottom: 1.5rem;">
    <input type="text" id="streaming-search" class="chat-input" placeholder="Search movies, year, genres..."
        oninput="StreamingManager.search(this.value)" style="width: 100%;">
</div>

<!-- Streaming Grid Container -->
<div class="news-grid" id="streaming-container">
    <div class="loading">Loading streaming feed...</div>
</div>

<!-- Last Updated -->
<div style="text-align: center; margin-top: 1.5rem; opacity: 0.6; font-size: 0.9rem;">
    Last updated: <span id="streaming-updated-at">-</span>
</div>

<style>

        gap: 1rem;
    }

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;

        flex-direction: column;

        width: 100%;
