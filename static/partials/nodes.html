<!-- nodes section -->
<h2 class="section-title">🖥️ Cluster Nodes</h2>

<!-- Node Stats Grid -->
<div class="argocd-stats" id="node-stats-grid" style="margin-bottom: 1.5rem;">
    <div class="stat-box info">
        <div class="stat-value" id="node-total">-</div>
        <div class="stat-label">Total Nodes</div>
    </div>
    <div class="stat-box healthy">
        <div class="stat-value" id="node-ready">-</div>
        <div class="stat-label">Ready</div>
    </div>
    <div class="stat-box unhealthy">
        <div class="stat-value" id="node-notready">-</div>
        <div class="stat-label">Not Ready</div>
    </div>
</div>

<!-- Diagnostic Button (Hidden by default, shown on error) -->
<div id="nodes-diagnostic-tool"
    style="display: none; margin-bottom: 1.5rem; padding: 1rem; background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; border-radius: 4px;">
    <h3 style="color: #ff4444; margin-top: 0;">🛠️ Nodes Diagnostic</h3>
    <p>An error occurred while fetching nodes. Use this tool to identify the cause.</p>
    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <button class="cyber-btn" onclick="K8sManager.runNodesDiagnostic()" id="btn-run-diagnostic">Run Deep
            Diagnostic</button>
    </div>
    <div id="nodes-diagnostic-result"
        style="font-family: monospace; font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 4px; display: none; white-space: pre-wrap;">
    </div>
</div>

<!-- Node Cards Container -->
<div class="nodes-container" id="nodes-container">
    <div class="loading">Loading nodes status...</div>
</div>
