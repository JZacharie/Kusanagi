<!-- proxmox section -->
<h2 class="section-title">🖥️ Proxmox Infrastructure</h2>

<!-- Environment Variable Info -->
<div class="info-box" style="margin-bottom: 1rem; padding: 0.75rem; background: rgba(0, 255, 255, 0.1); border: 1px solid var(--neon-cyan); border-radius: 4px;">
    <div style="font-size: 0.9rem; color: var(--neon-cyan);">
        📡 Using PROXMOX_URLS environment variable for multi-server monitoring
    </div>
</div>

<!-- Proxmox Stats -->
<div class="argocd-stats" id="proxmox-stats-grid" style="margin-bottom: 1.5rem;">
    <div class="stat-box info">
        <div class="stat-value" id="proxmox-nodes">-</div>
        <div class="stat-label">Nodes</div>
    </div>
    <div class="stat-box healthy">
        <div class="stat-value" id="proxmox-vms">-</div>
        <div class="stat-label">Virtual Machines</div>
    </div>
    <div class="stat-box info">
        <div class="stat-value" id="proxmox-containers">-</div>
        <div class="stat-label">Containers</div>
    </div>
</div>

<!-- VMs Table -->
<div class="issues-table-container" style="border-color: var(--neon-cyan); margin-bottom: 1.5rem;">
    <div class="issues-table-header" style="background: rgba(0, 255, 255, 0.1); border-color: var(--neon-cyan);">
        <span class="issues-table-title" style="color: var(--neon-cyan);">💻 Virtual Machines</span>
        <span class="issues-count" id="proxmox-vms-count" style="background: var(--neon-cyan);">0</span>
    </div>
    <div id="proxmox-vms-content">
        <div class="loading">🔄 Loading VMs from Proxmox servers...</div>
    </div>
</div>

<!-- Containers Table -->
<div class="issues-table-container" style="border-color: var(--neon-magenta);">
    <div class="issues-table-header" style="background: rgba(255, 0, 128, 0.1); border-color: var(--neon-magenta);">
        <span class="issues-table-title" style="color: var(--neon-magenta);">📦 LXC Containers</span>
        <span class="issues-count" id="proxmox-containers-count" style="background: var(--neon-magenta);">0</span>
    </div>
    <div id="proxmox-containers-content">
        <div class="loading">🔄 Loading containers from Proxmox servers...</div>
    </div>
</div>
