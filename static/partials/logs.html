<!-- logs section -->
<div id="logs-modal" class="cyber-modal" style="display: none;">
    <div class="cyber-modal-content" style="max-width: 90%; width: 1000px; max-height: 80vh;">
        <div class="cyber-modal-header">
            <h3 id="logs-modal-title">📄 Pod Logs: Unknown</h3>
            <span class="cyber-modal-close" onclick="LogsManager.closeModal()">&times;</span>
        </div>
        <div class="cyber-modal-body"
            style="background: rgba(0, 0, 0, 0.8); padding: 1rem; border: 1px solid var(--neon-blue);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <div>
                    <span class="stat-label">Lines: </span>
                    <select id="log-tail-select" class="cyber-input" style="width: 100px; padding: 2px 5px;"
                        onchange="LogsManager.refreshLogs()">
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <button class="cyber-btn" style="padding: 5px 15px;" onclick="LogsManager.refreshLogs()">🔄
                    Refresh</button>
            </div>
            <pre id="log-content"
                style="height: 50vh; overflow-y: auto; color: #fff; font-family: 'Courier New', monospace; font-size: 0.9rem; margin: 0; white-space: pre-wrap;"></pre>
        </div>
    </div>
</div>
