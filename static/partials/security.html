<!-- security section -->
<h2 class="section-title">🛡️ Security Center</h2>

<!-- Quick Links -->
<div class="security-quick-links" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
    <a href="https://powerpipe.p.zacharie.org/kubernetes_compliance.benchmark.cis_v170" target="_blank"
        class="cyber-btn"
        style="border-color: var(--neon-cyan); color: var(--neon-cyan); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
        <span>📜</span> CIS Compliance
    </a>
    <a href="https://trivy.p.zacharie.org" target="_blank" class="cyber-btn"
        style="border-color: var(--neon-magenta); color: var(--neon-magenta); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
        <span>🔍</span> Trivy Server
    </a>
    <button onclick="SecurityDashboard.refreshAll()" class="cyber-btn"
        style="border-color: var(--neon-green); color: var(--neon-green); display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
        <span>🔄</span> Refresh All
    </button>
</div>



<!-- Stats Cards -->
<div class="security-stats-grid" id="security-stats-grid"
    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
    <div class="stat-box unhealthy">
        <div class="stat-value" id="security-critical-vulns">0</div>
        <div class="stat-label">Critical</div>
    </div>
    <div class="stat-box warning">
        <div class="stat-value" id="security-high-vulns">0</div>
        <div class="stat-label">High</div>
    </div>
    <div class="stat-box info">
        <div class="stat-value" id="security-medium-vulns">0</div>
        <div class="stat-label">Medium</div>
    </div>
    <div class="stat-box healthy">
        <div class="stat-value" id="security-low-vulns">0</div>
        <div class="stat-label">Low</div>
    </div>
    <div class="stat-box" style="border-color: var(--neon-cyan);">
        <div class="stat-value" id="security-total-vulns" style="color: var(--neon-cyan);">0</div>
        <div class="stat-label">Total</div>
    </div>
</div>



<!-- Report Selector -->
<div id="security-report-selector" style="margin-bottom: 1rem;"></div>

<!-- Report Detail Modal -->
<div id="report-detail-modal" class="cyber-modal" style="display: none;">
    <div class="cyber-modal-content" style="max-width: 90%; width: 1200px; max-height: 85vh;">
        <div class="cyber-modal-header" style="background: rgba(255, 0, 128, 0.1); border-color: var(--neon-magenta);">
            <h3 style="color: var(--neon-magenta); margin: 0;">📊 Security Report Detail</h3>
            <span class="cyber-modal-close" onclick="SecurityDashboard.closeReportModal()">&times;</span>
        </div>
        <div class="cyber-modal-body" style="overflow-y: auto; max-height: calc(85vh - 80px);">
            <div id="report-detail-content">
                <div class="loading">Loading report...</div>
            </div>
        </div>
    </div>
</div>

<!-- Vulnerabilities Table -->
<div class="issues-table-container" style="border-color: var(--neon-magenta); margin-bottom: 1.5rem;">
    <div class="issues-table-header" style="background: rgba(255, 0, 128, 0.1); border-color: var(--neon-magenta);">
        <span class="issues-table-title" style="color: var(--neon-magenta);">🔍 Container Vulnerabilities</span>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span id="filtered-count" style="font-size: 0.75rem; color: #888;"></span>
            <span class="issues-count" id="security-vuln-count" style="background: var(--neon-magenta);">0</span>
        </div>
    </div>
    <div id="security-vulns-content">
        <div class="loading">Loading vulnerability reports...</div>
    </div>
</div>



<!-- Summary by Namespace -->
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
    <div class="issues-table-container" style="border-color: var(--neon-cyan);">
        <div class="issues-table-header" style="background: rgba(0, 255, 255, 0.1); border-color: var(--neon-cyan);">
            <span class="issues-table-title" style="color: var(--neon-cyan);">🏢 By Namespace</span>
        </div>
        <div id="security-by-namespace">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <div class="issues-table-container" style="border-color: var(--neon-yellow, #ffff00);">
        <div class="issues-table-header"
            style="background: rgba(255, 255, 0, 0.1); border-color: var(--neon-yellow, #ffff00);">
            <span class="issues-table-title" style="color: var(--neon-yellow, #ffff00);">⚠️ Top Risk Images</span>
        </div>
        <div id="security-top-risk">
            <div class="loading">Loading...</div>
        </div>
    </div>
</div>
