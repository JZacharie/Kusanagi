# ============================================================================
# LiteLLM Configuration for Kusanagi
# 
# This ConfigMap configures Kusanagi to use LiteLLM proxy instead of 
# direct Ollama connection.
#
# LiteLLM endpoint: litellm.litellm.svc.cluster.local:4000
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: kusanagi-llm-config
  namespace: kusanagi
  labels:
    app: kusanagi
data:
  # Provider: litellm, ollama, openai, anthropic
  LLM_PROVIDER: "litellm"
  
  # LiteLLM proxy URL (internal Kubernetes DNS)
  # Format: http://<service>.<namespace>.svc.cluster.local:<port>
  LLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  
  # Default model to use (must be configured in LiteLLM)
  # Common options: gpt-3.5-turbo, gpt-4, claude-3-haiku, etc.
  LLM_MODEL: "gpt-3.5-turbo"
  
  # Request timeout in seconds (LiteLLM may take longer than local Ollama)
  LLM_TIMEOUT_SECS: "60"
  
  # Maximum retry attempts
  LLM_MAX_RETRIES: "3"
  
  # Temperature for generation (0.0 - 1.0)
  LLM_TEMPERATURE: "0.7"
  
  # Maximum tokens to generate
  LLM_MAX_TOKENS: "2048"
  
  # Optional: API key if LiteLLM requires authentication
  # LLM_API_KEY: "sk-..."

---
# Alternative: Use this if LiteLLM is in the same namespace
# apiVersion: v1
# kind: ConfigMap
