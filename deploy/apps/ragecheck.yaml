# RageCheck - Version robuste avec restart automatique
# 
# ⚠️ NOTE: Ce déploiement build l'application au premier démarrage.
# Le premier démarrage peut prendre 2-3 minutes.

apiVersion: v1
kind: Namespace
metadata:
  name: ragecheck

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragecheck
  namespace: ragecheck
spec:
  replicas: 1
  strategy:
    type: Recreate  # Évite les conflits de build
  selector:
    matchLabels:
      app: ragecheck
  template:
    metadata:
      labels:
        app: ragecheck
    spec:
      containers:
        - name: app
          image: ghcr.io/jzacharie/ragecheck:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
      # Redémarrage automatique en cas d'échec
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ragecheck
  namespace: ragecheck
spec:
  selector:
    app: ragecheck
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragecheck
  namespace: ragecheck
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ragecheck.zacharie.org
      secretName: ragecheck-tls
  rules:
    - host: ragecheck.zacharie.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragecheck
                port:
                  number: 80
